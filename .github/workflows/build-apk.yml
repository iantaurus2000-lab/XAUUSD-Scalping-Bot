name: Build XAUUSD APK

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q XAUUSD_Scalping_Bot_GitHub_HP.zip -d project
          echo "Isi ZIP:"
          find project -maxdepth 3 -type f

      - name: Find Android project
        run: |
          ROOT=$(find project -name settings.gradle.kts -type f | head -1 | xargs dirname)
          echo "ROOT=$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Gradle 8.10
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.10-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.10/bin" >> "$GITHUB_PATH"

      - name: Copy Android project
        run: |
          cp -r "$ROOT/app" .
          cp "$ROOT/settings.gradle.kts" .
          cp "$ROOT/build.gradle.kts" .
          cp "$ROOT/gradle.properties" .

      - name: Check project
        run: |
          echo "=== settings.gradle.kts ==="
          cat settings.gradle.kts
          echo "=== app/build.gradle.kts ==="
          cat app/build.gradle.kts

      - name: Build APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Scalping-Bot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
