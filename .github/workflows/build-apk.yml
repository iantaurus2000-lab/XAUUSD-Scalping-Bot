      - name: Extract project ZIP
        run: |
          unzip -q XAUUSD_Scalping_Bot_GitHub_HP.zip -d project
          find project -maxdepth 3 -type f | head -50
          ROOT=$(find project -name settings.gradle.kts -type f | head -1 | xargs dirname)
          echo "Project root: $ROOT"
          cp -r "$ROOT/app" .
          cp "$ROOT/settings.gradle.kts" .
          cp "$ROOT/build.gradle.kts" .
          cp "$ROOT/gradle.properties" .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.10-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.10/bin" >> $GITHUB_PATH

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Scalping-Bot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
