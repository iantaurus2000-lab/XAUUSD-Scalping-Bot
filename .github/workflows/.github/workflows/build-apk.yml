name: Build XAUUSD APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "=== FILE REPOSITORY ==="
          find . -maxdepth 4 -type f | sort

      - name: Extract ZIP
        run: |
          mkdir -p project
          unzip -q XAUUSD_Scalping_Bot_GitHub_HP.zip -d project
          echo "=== HASIL EKSTRAK ==="
          find project -maxdepth 5 -type f | sort

      - name: Find Android project
        run: |
          ROOT=$(find project -name "settings.gradle.kts" -type f | head -1 | xargs dirname)

          if [ -z "$ROOT" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan"
            exit 1
          fi

          echo "Android project ditemukan di: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.10-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.10/bin" >> "$GITHUB_PATH"

      - name: Copy Android project
        run: |
          cp -r "$ROOT/app" .
          cp "$ROOT/settings.gradle.kts" .
          cp "$ROOT/build.gradle.kts" .
          cp "$ROOT/gradle.properties" .

      - name: Check Android project
        run: |
          echo "=== settings.gradle.kts ==="
          cat settings.gradle.kts

          echo "=== app/build.gradle.kts ==="
          cat app/build.gradle.kts

          echo "=== PROJECT FILES ==="
          find app -maxdepth 5 -type f | sort

      - name: Build APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Check APK
        run: |
          echo "=== APK ==="
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Scalping-Bot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
